<!-- To list all students data -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Students - EduTrack</title>
    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

    <!-- Top Navbar Header -->
    <header class="site-header">
        <div class="brand-container">
            <div class="brand-logo-badge">✦</div>
            <div class="brand-text-wrap">
                <span class="brand-title">EduTrack</span>
                <span class="brand-tagline">Smart Student Records</span>
            </div>
        </div>

        <nav class="main-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="list.html" class="nav-link active">Students</a>
            <a href="listOne.html" class="nav-link">Search</a>
            <a href="insert.html" class="nav-link">Add Student</a>
            <a href="update.html" class="nav-link">Update</a>
            <a href="delete.html" class="nav-link">Delete</a>
        </nav>
    </header>

    <!-- Two-Column Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <div class="hero-badge">📋 STUDENT DIRECTORY</div>
            <h1 class="hero-title"><span class="heading-icon">📋</span> LIST OF STUDENTS</h1>
            <p class="hero-subtitle">View, inspect, and monitor all active enrolled students in the directory in real time.</p>
            <div class="hero-cta">
                <button class="btn" onclick="loadStudents()">Refresh List 🔄</button>
                <button class="btn btn-outline" onclick="location.href='index.html'">Home Page 🏠</button>
            </div>
        </div>

        <div class="hero-image-wrap">
            <img src="images/list.jpg" alt="Students studying together in classroom" class="hero-image">
        </div>
    </section>

    <!-- Scrollable Table Container -->
    <div class="table-container">
        <table border="1" id="studentTable">
            <!--Following line is Optional -->
            <!--<tr>
            <th>Student Number</th>
            <th>Name</th>
            <th>Total</th>
            </tr> -->
        </table>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p>© 2026 EduTrack – Student Management System</p>
    </footer>

</div>

<script>
loadStudents();
function loadStudents()
{
fetch("/students")  //first .then is used to convert response object to JSON format
                    //second .then is used to extract data from JSON object
.then(response=>response.json())
.then(data=>{
let table=document.getElementById("studentTable");
table.innerHTML=`
<tr>
<th>Student Number</th>
<th>Name</th>
<th>Total</th>
</tr>`;

data.forEach(student=>{
table.innerHTML+=`
<tr>
<td>${student.student_id}</td>
<td>${student.student_name}</td>
<td>${student.total}</td>
</tr>
`;
});
});
}
</script>
</body>
</html>
