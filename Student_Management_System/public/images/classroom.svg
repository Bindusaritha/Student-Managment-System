<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="140" style="border-radius:12px;">
  <defs>
    <linearGradient id="bgGradList" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="70%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#134E4A" />
    </linearGradient>
    <linearGradient id="accentGradList" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadowList" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="140" fill="url(#bgGradList)" rx="12" />

  <circle cx="50" cy="30" r="60" fill="#14B8A6" fill-opacity="0.15" />
  <circle cx="540" cy="110" r="70" fill="#F59E0B" fill-opacity="0.15" />

  <!-- Classroom Board Silhouette (Left) -->
  <g transform="translate(40, 22)" filter="url(#shadowList)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#042F2E" stroke="#F59E0B" stroke-width="2" />
    <line x1="12" y1="20" x2="60" y2="20" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="32" x2="85" y2="32" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="44" x2="70" y2="44" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" />
    <circle cx="95" cy="55" r="7" fill="url(#accentGradList)" />
    <!-- Stand -->
    <line x1="25" y1="70" x2="15" y2="92" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <line x1="85" y1="70" x2="95" y2="92" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Main Roster / Table Card (Center) -->
  <g transform="translate(195, 18)" filter="url(#shadowList)">
    <rect x="0" y="0" width="220" height="88" rx="8" fill="#FFFFFF" />
    <!-- Table Header Bar -->
    <rect x="0" y="0" width="220" height="24" rx="8" fill="#0F766E" />
    <rect x="0" y="16" width="220" height="8" fill="#0F766E" />
    <!-- Header Labels -->
    <text x="18" y="16" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600">ROLL NO</text>
    <text x="85" y="16" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600">STUDENT NAME</text>
    <text x="180" y="16" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600">TOTAL</text>
    <!-- Row 1 -->
    <rect x="0" y="24" width="220" height="21" fill="#F0FDFA" />
    <text x="25" y="38" fill="#0F766E" font-family="'Poppins', sans-serif" font-size="9" font-weight="600">235</text>
    <text x="85" y="38" fill="#1F2937" font-family="'Poppins', sans-serif" font-size="9" font-weight="500">Pooji</text>
    <text x="185" y="38" fill="#0F766E" font-family="'Poppins', sans-serif" font-size="9" font-weight="600">900</text>
    <!-- Row 2 -->
    <rect x="0" y="45" width="220" height="21" fill="#FFFFFF" />
    <text x="25" y="59" fill="#0F766E" font-family="'Poppins', sans-serif" font-size="9" font-weight="600">238</text>
    <text x="85" y="59" fill="#1F2937" font-family="'Poppins', sans-serif" font-size="9" font-weight="500">Siri</text>
    <text x="185" y="59" fill="#0F766E" font-family="'Poppins', sans-serif" font-size="9" font-weight="600">980</text>
    <!-- Row 3 Hovered -->
    <rect x="0" y="66" width="220" height="22" rx="4" fill="#FEF3C7" />
    <text x="25" y="80" fill="#B45309" font-family="'Poppins', sans-serif" font-size="9" font-weight="600">240</text>
    <text x="85" y="80" fill="#B45309" font-family="'Poppins', sans-serif" font-size="9" font-weight="600">Hari</text>
    <text x="185" y="80" fill="#B45309" font-family="'Poppins', sans-serif" font-size="9" font-weight="600">985</text>
  </g>

  <!-- Classroom Statistics Badge (Right) -->
  <g transform="translate(450, 24)" filter="url(#shadowList)">
    <rect x="0" y="0" width="115" height="74" rx="8" fill="#FFFFFF" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="url(#accentGradList)" />
    <path d="M20 26 L24 30 L32 20" stroke="#042F2E" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="48" y="22" fill="#6B7280" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="500">ACTIVE</text>
    <text x="48" y="36" fill="#0F766E" font-family="'Poppins', sans-serif" font-size="14" font-weight="700">ROSTER</text>
    <rect x="12" y="50" width="90" height="6" rx="3" fill="#E5E7EB" />
    <rect x="12" y="50" width="70" height="6" rx="3" fill="#14B8A6" />
    <text x="12" y="68" fill="#6B7280" font-family="'Poppins', sans-serif" font-size="8">Verified Records</text>
  </g>

  <!-- Subtitle pill -->
  <g transform="translate(180, 114)">
    <rect x="0" y="0" width="240" height="20" rx="10" fill="#042F2E" fill-opacity="0.55" />
    <text x="120" y="14" fill="#FFFBF2" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="0.6">
      CLASSROOM STUDENT ROSTER
    </text>
  </g>
</svg>
