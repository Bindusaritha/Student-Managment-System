<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="140" style="border-radius:12px;">
  <defs>
    <linearGradient id="bgGradEdit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="60%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="accentGradEdit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadowEdit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="140" fill="url(#bgGradEdit)" rx="12" />

  <circle cx="80" cy="110" r="60" fill="#14B8A6" fill-opacity="0.12" />
  <circle cx="520" cy="30" r="70" fill="#F59E0B" fill-opacity="0.15" />

  <!-- Circular Sync / Update Arrows (Left) -->
  <g transform="translate(60, 24)" filter="url(#shadowEdit)">
    <circle cx="42" cy="42" r="38" fill="#FFFFFF" />
    <!-- Refresh circular path -->
    <path d="M42 16 A26 26 0 0 1 68 42 L62 42" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" />
    <polygon points="68,36 76,46 63,48" fill="#0F766E" />
    <path d="M42 68 A26 26 0 0 1 16 42 L22 42" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    <polygon points="16,48 8,38 21,36" fill="#F59E0B" />
    <!-- Center check / edit -->
    <circle cx="42" cy="42" r="10" fill="#F0FDFA" />
    <circle cx="42" cy="42" r="4" fill="#0F766E" />
  </g>

  <!-- Editing Card Preview (Center) -->
  <g transform="translate(195, 16)" filter="url(#shadowEdit)">
    <rect x="0" y="0" width="220" height="92" rx="10" fill="#FFFFFF" />
    
    <!-- Top badge -->
    <rect x="15" y="14" width="70" height="18" rx="5" fill="#FEF3C7" />
    <text x="50" y="27" fill="#B45309" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" text-anchor="middle">EDIT MODE</text>

    <text x="15" y="48" fill="#1F2937" font-family="'Poppins', sans-serif" font-size="13" font-weight="700">Modify Student Info</text>
    <text x="15" y="62" fill="#6B7280" font-family="'Poppins', sans-serif" font-size="9.5">Update name &amp; academic total marks</text>

    <!-- Sliders / interactive visual -->
    <rect x="15" y="74" width="130" height="6" rx="3" fill="#E5E7EB" />
    <rect x="15" y="74" width="95" height="6" rx="3" fill="#0F766E" />
    <circle cx="110" cy="77" r="7" fill="url(#accentGradEdit)" />

    <!-- Edit Pen Icon Floating on Card -->
    <circle cx="185" cy="46" r="20" fill="url(#accentGradEdit)" />
    <!-- Pencil icon -->
    <g transform="translate(175, 36)">
      <path d="M12 2 L18 8 L7 19 L1 19 L1 13 Z" fill="#042F2E" />
      <polygon points="1 19 1 15 5 19" fill="#DC2626" />
    </g>
  </g>

  <!-- Sliders / Settings Icon Graphic (Right) -->
  <g transform="translate(455, 24)" filter="url(#shadowEdit)">
    <rect x="0" y="0" width="100" height="74" rx="8" fill="#FFFFFF" />
    <!-- Slider 1 -->
    <line x1="18" y1="20" x2="82" y2="20" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round" />
    <circle cx="38" cy="20" r="6" fill="#0F766E" />
    <!-- Slider 2 -->
    <line x1="18" y1="37" x2="82" y2="37" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round" />
    <circle cx="62" cy="37" r="6" fill="#F59E0B" />
    <!-- Slider 3 -->
    <line x1="18" y1="54" x2="82" y2="54" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round" />
    <circle cx="48" cy="54" r="6" fill="#14B8A6" />
  </g>

  <g transform="translate(180, 114)">
    <rect x="0" y="0" width="240" height="20" rx="10" fill="#042F2E" fill-opacity="0.55" />
    <text x="120" y="14" fill="#FFFBF2" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="0.6">
      STUDENT RECORD UPDATES
    </text>
  </g>
</svg>
