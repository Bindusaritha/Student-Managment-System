<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="100%" height="140" style="border-radius:12px;">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="60%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="140" fill="url(#bgGrad1)" rx="12" />

  <!-- Decorative Background Elements -->
  <circle cx="80" cy="110" r="70" fill="#14B8A6" fill-opacity="0.12" />
  <circle cx="520" cy="20" r="80" fill="#F59E0B" fill-opacity="0.15" />
  <circle cx="340" cy="130" r="50" fill="#FFFFFF" fill-opacity="0.05" />

  <!-- University / Campus Building Silhouette (Left) -->
  <g transform="translate(45, 25)" filter="url(#shadow1)">
    <!-- Main Hall -->
    <polygon points="40,25 0,45 80,45" fill="url(#accentGrad)" />
    <rect x="10" y="45" width="60" height="50" fill="#FFFFFF" opacity="0.95" rx="3" />
    <rect x="30" y="65" width="20" height="30" fill="#0F766E" rx="10" />
    <!-- Pillars -->
    <rect x="15" y="48" width="6" height="44" fill="#0F766E" opacity="0.3" rx="2" />
    <rect x="59" y="48" width="6" height="44" fill="#0F766E" opacity="0.3" rx="2" />
    <!-- Clock / Dome -->
    <circle cx="40" cy="38" r="4" fill="#042F2E" />
  </g>

  <!-- Center Floating Graduation Cap & Diploma -->
  <g transform="translate(230, 25)" filter="url(#shadow1)">
    <!-- Cap base -->
    <ellipse cx="65" cy="55" rx="25" ry="10" fill="#FFFFFF" opacity="0.9" />
    <!-- Mortarboard Diamond -->
    <polygon points="65,22 115,40 65,58 15,40" fill="url(#accentGrad)" />
    <!-- Tassel -->
    <circle cx="65" cy="40" r="3" fill="#042F2E" />
    <path d="M65 40 Q85 45 92 62" stroke="#042F2E" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="92" cy="63" r="3" fill="#DC2626" />
  </g>

  <!-- Right Floating Records & Badges -->
  <g transform="translate(420, 28)" filter="url(#shadow1)">
    <!-- Student Record Card -->
    <rect x="0" y="5" width="110" height="72" rx="8" fill="#FFFFFF" />
    <!-- Card Header Strip -->
    <rect x="0" y="5" width="110" height="18" rx="6" fill="#0F766E" />
    <circle cx="16" cy="14" r="5" fill="url(#accentGrad)" />
    <rect x="28" y="11" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.8" />
    <!-- Card Data Lines -->
    <rect x="12" y="32" width="70" height="5" rx="2.5" fill="#E5E7EB" />
    <rect x="12" y="43" width="85" height="5" rx="2.5" fill="#E5E7EB" />
    <rect x="12" y="54" width="45" height="5" rx="2.5" fill="#14B8A6" />
    <circle cx="92" cy="56" r="8" fill="url(#accentGrad)" />
    <polyline points="89,56 91,58 95,54" stroke="#042F2E" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>

  <!-- Center Text / Badge overlay -->
  <g transform="translate(170, 106)">
    <rect x="0" y="0" width="260" height="24" rx="12" fill="#042F2E" fill-opacity="0.6" />
    <text x="130" y="16" fill="#FFFBF2" font-family="'Poppins', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" letter-spacing="0.8">
      SMART STUDENT ACADEMIC PORTAL
    </text>
  </g>
</svg>
