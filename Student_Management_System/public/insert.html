<!--To insert student data-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Student - EduTrack</title>
    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

    <!-- Top Navbar Header -->
    <header class="site-header">
        <div class="brand-container">
            <div class="brand-logo-badge">✦</div>
            <div class="brand-text-wrap">
                <span class="brand-title">EduTrack</span>
                <span class="brand-tagline">Smart Student Records</span>
            </div>
        </div>

        <nav class="main-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="list.html" class="nav-link">Students</a>
            <a href="listOne.html" class="nav-link">Search</a>
            <a href="insert.html" class="nav-link active">Add Student</a>
            <a href="update.html" class="nav-link">Update</a>
            <a href="delete.html" class="nav-link">Delete</a>
        </nav>
    </header>

    <!-- Two-Column Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <div class="hero-badge">➕ NEW ENROLLMENT</div>
            <h1 class="hero-title"><span class="heading-icon">➕</span> INSERT STUDENT</h1>
            <p class="hero-subtitle">Register and enroll a new student into the school database system with ease.</p>
        </div>

        <div class="hero-image-wrap">
            <img src="images/insert.jpg" alt="Student registration and admission" class="hero-image">
        </div>
    </section>

    <!-- Form Card -->
    <div class="form-card">
        <div class="form-group">
            <label for="sno" class="form-label">Student Number</label>
            <input type="number" id="sno" placeholder="Enter student roll number (e.g. 101)" required>
        </div>

        <div class="form-group">
            <label for="name" class="form-label">Student Name</label>
            <input type="text" id="name" placeholder="Enter student full name" required>
        </div>

        <div class="form-group">
            <label for="total" class="form-label">Total Marks</label>
            <input type="number" id="total" placeholder="Enter total marks obtained" required>
        </div>

        <div class="button-group">
            <button class="btn" onclick="saveStudent()">Save 💾</button>
            <button class="btn btn-outline" onclick="location.href='index.html'">Home Page 🏠</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p>© 2026 EduTrack – Student Management System</p>
    </footer>

</div>

<script>
function saveStudent()
{
let sno=document.getElementById("sno").value;
let name=document.getElementById("name").value;
let total=document.getElementById("total").value;

if (!sno || !name || !total) {
    alert("Please fill in all fields");
    return;
}

fetch("/students",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
sno:sno,
name:name,
total:total
})
})
.then(response=>response.text())
.then(message=>{
alert(message);
location.href="index.html";
});

}

</script>
</body>
</html>
